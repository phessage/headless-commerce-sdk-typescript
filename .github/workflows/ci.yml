name: CI
on:
  # Public repository on the organisation's self-hosted runners. Pull requests
  # (including any from forks) never trigger a run: CI runs only for pushes to
  # main, release tags and manual dispatch by a maintainer.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
