name: CI
on:
  push:
    branches-ignore: ["integration/**", "wave/**"]
  pull_request:
    branches-ignore: ["integration/**"]
permissions: { contents: read }
jobs:
  check:
    # Hosted runners: the repository is public and the organisation runner pool
    # does not serve public repositories. Hosted minutes are free for public repos.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
