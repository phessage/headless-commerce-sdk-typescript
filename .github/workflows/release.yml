name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to release
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: typescript-sdk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: package-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@phessage'
          cache: npm
      - name: Verify immutable release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          manifest_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_VERSION" = "$manifest_version"
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - name: Build release archive and dependency SBOM
        run: |
          mkdir release
          npm pack --pack-destination release
          npm sbom --sbom-format=spdx > release/phessage-headless-commerce-sdk.spdx.json
          shasum -a 256 release/* > release/SHA256SUMS
      - name: Publish restricted package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag "v$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" release/* --verify-tag --title "v$RELEASE_VERSION" --generate-notes
